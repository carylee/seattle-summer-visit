featured:
  - title: "Crystal Mountain + Mt. Rainier Adventure"
    icon: "fa-mountain"
    description: |
      Ride the <a href="https://www.crystalmountainresort.com/" target="_blank">Crystal Mountain Gondola</a> up for epic views and lunch, then drive to <a href="https://www.nps.gov/mora/index.htm" target="_blank">Mt. Rainier National Park</a> for a scenic hike or waterfall stop.<br>
      <span class="featured-links">See: <a href="#day-trips">Day Trips</a></span>
  - title: "Bainbridge Ferry & Kids Museum Day"
    icon: "fa-ship"
    description: |
      Take the <a href="https://www.wsdot.wa.gov/ferries/" target="_blank">ferry to Bainbridge</a>, stroll off for coffee or lunch, and visit the <a href="https://kidimu.org/" target="_blank">KiDiMu (Kids Discovery Museum)</a> just 5 minutes from the dock.
      <br><span class="featured-links">See: <a href="#water">On-The-Water</a> & <a href="#museums">Museums</a></span>
  - title: "Boat Day on Lake Union & Lake Washington"
    icon: "fa-anchor"
    description: |
      Full day on the water with Freedom Boat Club (10am-8:30pm) cruising Lake Union to Lake Washington. Jon, Todd, Robin, and Cary will be there! Perfect for a picnic lunch on the boat.<br>
      <span class="featured-links">See: <a href="#water">On-The-Water</a></span>

